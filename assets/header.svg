<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" role="img" aria-label="Tanish Kumar - AI Systems Terminal">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .cursor-blink { animation: termBlink 1s step-end infinite; }
      @keyframes termBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .pulse-dot { animation: dotPulse 2s ease-in-out infinite; }
      @keyframes dotPulse { 0%, 100% { r: 3.5; opacity: 1; } 50% { r: 5; opacity: 0.6; } }
      .bar-anim { animation: vramBar 4s ease-in-out infinite; }
      @keyframes vramBar { 0%, 100% { width: 285px; } 50% { width: 310px; } }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="1200" height="320" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 1190 0 C 1195.523 0 1200 4.477 1200 10 L 1200 38 L 0 38 Z" fill="#161b22"/>
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls (macOS style) -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>

  <!-- Active Tab -->
  <path d="M 90 38 L 90 12 C 90 8 93 6 97 6 L 275 6 C 279 6 282 8 282 12 L 282 38 Z" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="110" y="23" class="mono" font-size="12" fill="#58a6ff" font-weight="600">⚡ tanish_core.py</text>
  <text x="260" y="22" class="mono" font-size="12" fill="#8b949e">×</text>

  <!-- Titlebar Center Info -->
  <text x="600" y="23" text-anchor="middle" class="mono" font-size="11.5" fill="#8b949e">tanish@ai-workstation: ~/profile/ai-engineer (zsh)</text>

  <!-- Titlebar Right Meta -->
  <text x="1175" y="23" text-anchor="end" class="mono" font-size="11" fill="#7ee787">● main* (clean)</text>

  <!-- ==================== TERMINAL BODY ==================== -->

  <!-- Top Prompt Line -->
  <g transform="translate(30, 68)">
    <text class="mono" font-size="13.5" fill="#7ee787" font-weight="bold">tanish@workstation</text>
    <text x="165" y="0" class="mono" font-size="13.5" fill="#8b949e">:</text>
    <text x="175" y="0" class="mono" font-size="13.5" fill="#79c0ff" font-weight="bold">~/profile</text>
    <text x="255" y="0" class="mono" font-size="13.5" fill="#e6edf3">$ python -m sys.init --target=production</text>
  </g>

  <!-- Left Card: Code / Dataclass Specification -->
  <g transform="translate(30, 88)">
    <rect width="690" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <!-- Header Comment -->
    <text x="18" y="26" class="mono" font-size="11" fill="#8b949e"># ─── IDENTITY &amp; CORE FOCUS ────────────────────────────────────────────────</text>

    <!-- Name Line -->
    <text x="18" y="56" class="mono" font-size="13" fill="#ff7b72" font-weight="bold">NAME</text>
    <text x="100" y="56" class="mono" font-size="13" fill="#8b949e">=</text>
    <text x="125" y="56" class="mono" font-size="20" fill="#f0f6fc" font-weight="bold" letter-spacing="1.5">TANISH KUMAR</text>

    <!-- Role Line -->
    <text x="18" y="86" class="mono" font-size="13" fill="#ff7b72" font-weight="bold">ROLE</text>
    <text x="100" y="86" class="mono" font-size="13" fill="#8b949e">=</text>
    <text x="125" y="86" class="mono" font-size="13.5" fill="#a5d6ff" font-weight="bold">&quot;AI Engineer · LLM Systems · Agentic AI · RAG&quot;</text>

    <!-- Status Line -->
    <text x="18" y="117" class="mono" font-size="13" fill="#ff7b72" font-weight="bold">STATUS</text>
    <text x="100" y="117" class="mono" font-size="13" fill="#8b949e">=</text>
    <rect x="125" y="101" width="280" height="23" rx="11.5" fill="rgba(35, 134, 54, 0.2)" stroke="#238636" stroke-width="1"/>
    <circle cx="138" cy="112.5" r="4" fill="#3fb950" class="pulse-dot"/>
    <text x="150" y="116.5" class="mono" font-size="11.5" fill="#3fb950" font-weight="bold">Open to AI Engineer Internships</text>

    <!-- Stack Line -->
    <text x="18" y="148" class="mono" font-size="13" fill="#ff7b72" font-weight="bold">STACK</text>
    <text x="100" y="148" class="mono" font-size="13" fill="#8b949e">=</text>
    <text x="125" y="148" class="mono" font-size="11.5" fill="#d2a8ff">[ &quot;PyTorch&quot;, &quot;vLLM&quot;, &quot;LangGraph&quot;, &quot;RAG&quot;, &quot;LoRA&quot;, &quot;FastAPI&quot;, &quot;Docker&quot; ]</text>

    <!-- Mission Line -->
    <text x="18" y="174" class="mono" font-size="13" fill="#ff7b72" font-weight="bold">MISSION</text>
    <text x="100" y="174" class="mono" font-size="13" fill="#8b949e">=</text>
    <text x="125" y="174" class="mono" font-size="12" fill="#79c0ff">&quot;Architecting scalable LLM systems, autonomous agents &amp; production AI&quot;</text>
  </g>

  <!-- Right Card: AI Engineer Profile Capabilities & Matrix -->
  <g transform="translate(735, 88)">
    <rect width="435" height="190" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    
    <!-- Header -->
    <text x="18" y="26" class="mono" font-size="11" fill="#7ee787" font-weight="bold">⚡ AI_CORE_CAPABILITIES.SYS</text>
    <text x="415" y="26" text-anchor="end" class="mono" font-size="11" fill="#8b949e">[STATUS: PRODUCTION READY]</text>
    <line x1="18" y1="36" x2="415" y2="36" stroke="#21262d" stroke-width="1"/>

    <!-- Autonomous Agents -->
    <text x="18" y="58" class="mono" font-size="10.5" fill="#8b949e">AUTONOMOUS AGENTS</text>
    <text x="415" y="58" text-anchor="end" class="mono" font-size="11" fill="#79c0ff" font-weight="bold">LangGraph · Multi-Agent · MCP</text>
    <rect x="18" y="66" width="397" height="7" rx="3.5" fill="#21262d"/>
    <rect x="18" y="66" width="345" height="7" rx="3.5" fill="#3fb950" class="bar-anim"/>

    <!-- LLM Systems & Inference -->
    <text x="18" y="94" class="mono" font-size="10.5" fill="#8b949e">LLM SYSTEMS &amp; SERVING</text>
    <text x="415" y="94" text-anchor="end" class="mono" font-size="11" fill="#d2a8ff" font-weight="bold">vLLM · Quantization (AWQ/FP8)</text>

    <!-- RAG & Vector Search -->
    <text x="18" y="120" class="mono" font-size="10.5" fill="#8b949e">RAG &amp; VECTOR SEARCH</text>
    <text x="415" y="120" text-anchor="end" class="mono" font-size="11" fill="#7ee787" font-weight="bold">Hybrid Retrieval · Vector DBs</text>

    <!-- Fine-Tuning & Adaptation -->
    <text x="18" y="146" class="mono" font-size="10.5" fill="#8b949e">FINE-TUNING &amp; EVALS</text>
    <text x="415" y="146" text-anchor="end" class="mono" font-size="11" fill="#ffa657" font-weight="bold">LoRA / QLoRA · Distillation · Evals</text>

    <!-- Bottom Status Bar -->
    <rect x="18" y="157" width="397" height="20" rx="4" fill="#0d1117"/>
    <text x="216" y="171" text-anchor="middle" class="mono" font-size="10" fill="#8b949e">STACK: PyTorch · CUDA · FastAPI · Docker · Python</text>
  </g>

  <!-- Bottom Prompt with Blinking Cursor -->
  <g transform="translate(30, 303)">
    <text class="mono" font-size="13" fill="#7ee787" font-weight="bold">tanish@workstation</text>
    <text x="160" y="0" class="mono" font-size="13" fill="#8b949e">:</text>
    <text x="170" y="0" class="mono" font-size="13" fill="#79c0ff" font-weight="bold">~/profile</text>
    <text x="250" y="0" class="mono" font-size="13" fill="#e6edf3">$ ./connect.sh --hire --role=&quot;AI Engineer&quot;</text>
    <rect x="620" y="-12" width="8" height="15" fill="#58a6ff" class="cursor-blink"/>
  </g>
</svg>