<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="140" role="img" aria-label="Tanish Kumar - Terminal Footer">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .cursor-blink { animation: termBlink 1s step-end infinite; }
      @keyframes termBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="1200" height="140" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Titlebar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 1190 0 C 1195.523 0 1200 4.477 1200 10 L 1200 32 L 0 32 Z" fill="#161b22"/>
  <line x1="0" y1="32" x2="1200" y2="32" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="37" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="16" r="5" fill="#27c93f"/>

  <!-- Titlebar Center Info -->
  <text x="600" y="20.5" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">zsh — session_summary.log (exit 0)</text>

  <!-- Titlebar Right Meta -->
  <text x="1175" y="20.5" text-anchor="end" class="mono" font-size="10.5" fill="#3fb950">⚡ STATUS: 0 ERRORS</text>

  <!-- ==================== TERMINAL BODY ==================== -->

  <!-- Line 1: Command Executed -->
  <g transform="translate(30, 58)">
    <text class="mono" font-size="12.5" fill="#7ee787" font-weight="bold">tanish@workstation</text>
    <text x="155" y="0" class="mono" font-size="12.5" fill="#8b949e">:</text>
    <text x="165" y="0" class="mono" font-size="12.5" fill="#79c0ff" font-weight="bold">~/profile</text>
    <text x="245" y="0" class="mono" font-size="12.5" fill="#e6edf3">$ python -c &quot;ship_tagline()&quot;</text>
  </g>

  <!-- Line 2: Terminal Output Banner -->
  <g transform="translate(30, 89)">
    <rect x="0" y="-18" width="1140" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
    <text x="18" y="1" class="mono" font-size="12.5" fill="#58a6ff" font-weight="bold">[OUTPUT]</text>
    <text x="100" y="1" class="mono" font-size="13.5" fill="#f0f6fc" font-weight="bold" letter-spacing="1.2">
      ⚡ Faster LLMs. Smarter Agents. Production-ready AI. ⚡
    </text>
    <text x="1120" y="1" text-anchor="end" class="mono" font-size="11" fill="#8b949e">
      [OPT · SERVE · DEPLOY]
    </text>
  </g>

  <!-- Line 3: Closing Prompt with Blinking Cursor -->
  <g transform="translate(30, 122)">
    <text class="mono" font-size="12.5" fill="#7ee787" font-weight="bold">tanish@workstation</text>
    <text x="155" y="0" class="mono" font-size="12.5" fill="#8b949e">:</text>
    <text x="165" y="0" class="mono" font-size="12.5" fill="#79c0ff" font-weight="bold">~/profile</text>
    <text x="245" y="0" class="mono" font-size="12.5" fill="#8b949e">$ # Ready to engineer LLMs and autonomous agents</text>
    <rect x="670" y="-11" width="7.5" height="14" fill="#58a6ff" class="cursor-blink"/>
  </g>
</svg>